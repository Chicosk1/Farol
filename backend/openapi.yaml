openapi: 3.0.3
info:
  title: API do Farol
  version: 0.1.0
  description: API REST do Farol, tutor de estudos com IA da UNIMATER.
paths:
  /api/aviso-privacidade:
    get:
      operationId: aviso_privacidade_retrieve
      summary: Texto da versão atual do aviso de privacidade
      tags:
      - contas
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvisoDePrivacidade'
          description: ''
  /api/dev/entrar:
    post:
      operationId: dev_entrar_create
      description: |-
        Abre a sessão de uma pessoa fictícia pelo e-mail. A rota só existe com
        FAROL_LOGIN_DESENVOLVIMENTO ligado (ACE-RNF-03).
      summary: Entra pelo e-mail, sem login institucional (só desenvolvimento e teste)
      tags:
      - desenvolvimento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaDeDesenvolvimentoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EntradaDeDesenvolvimentoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EntradaDeDesenvolvimentoRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eu'
          description: ''
  /api/disciplinas:
    get:
      operationId: disciplinas_list
      summary: Disciplinas da pessoa no perfil em uso
      parameters:
      - in: query
        name: busca
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: filtro
        schema:
          enum:
          - todas
          - favoritas
          - com-tutor
          type: string
          default: todas
          minLength: 1
        description: |-
          * `todas` - todas
          * `favoritas` - favoritas
          * `com-tutor` - com-tutor
      tags:
      - disciplinas
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Disciplina'
          description: ''
  /api/disciplinas/{disciplina_id}:
    get:
      operationId: disciplinas_retrieve
      summary: Uma disciplina da pessoa, com os mesmos dados da lista
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      tags:
      - disciplinas
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disciplina'
          description: ''
  /api/disciplinas/{disciplina_id}/duvidas:
    get:
      operationId: disciplinas_duvidas_list
      summary: As dúvidas da disciplina para o professor, sem dados do aluno
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      - in: query
        name: status
        schema:
          type: string
          enum:
          - aberta
          - respondida
        description: 'Padrão: aberta'
      tags:
      - duvidas
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DuvidaDoProfessor'
          description: ''
  /api/disciplinas/{disciplina_id}/duvidas/{duvida_id}:
    patch:
      operationId: disciplinas_duvidas_partial_update
      summary: Marca a dúvida como respondida em aula ou a oculta
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      - in: path
        name: duvida_id
        schema:
          type: integer
        required: true
      tags:
      - duvidas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMudancaDeStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMudancaDeStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMudancaDeStatusRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuvidaDoProfessor'
          description: ''
  /api/disciplinas/{disciplina_id}/favorito:
    put:
      operationId: disciplinas_favorito_update
      summary: Marca a disciplina como favorita
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      tags:
      - disciplinas
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
    delete:
      operationId: disciplinas_favorito_destroy
      summary: Marca a disciplina como favorita
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      tags:
      - disciplinas
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/disciplinas/{disciplina_id}/janelas-prova:
    get:
      operationId: disciplinas_janelas_prova_list
      description: As janelas de prova da disciplina, só para o professor dela (TUT-RF-07).
      summary: Janelas de prova em andamento e agendadas
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      tags:
      - tutor
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Janela'
          description: ''
    post:
      operationId: disciplinas_janelas_prova_create
      description: Sem início, a janela começa agora; sem fim, fica aberta até ser
        apagada.
      summary: Liga o modo prova agora ou agenda uma janela de prova
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      tags:
      - tutor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovaJanelaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NovaJanelaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NovaJanelaRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Janela'
          description: ''
  /api/disciplinas/{disciplina_id}/janelas-prova/{janela_id}:
    delete:
      operationId: disciplinas_janelas_prova_destroy
      summary: Apaga uma janela de prova (desliga o modo prova)
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      - in: path
        name: janela_id
        schema:
          type: integer
        required: true
      tags:
      - tutor
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/disciplinas/{disciplina_id}/materiais:
    get:
      operationId: disciplinas_materiais_list
      description: O professor e a administração veem todos, com status, etapa e avisos;
        o aluno vê só os prontos, apenas com id, aula, título e páginas.
      summary: Materiais da disciplina
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      tags:
      - materiais
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaterialDoProfessor'
          description: ''
    post:
      operationId: disciplinas_materiais_create
      description: Guarda o PDF, cria o material e põe o processamento na fila (MAT-RF-01
        a 03).
      summary: Envia o PDF de uma aula da disciplina
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      tags:
      - materiais
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnvioDeMaterialRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialEnviado'
          description: ''
  /api/disciplinas/{disciplina_id}/minhas-duvidas:
    get:
      operationId: disciplinas_minhas_duvidas_list
      summary: As dúvidas que o aluno enviou na disciplina e o status de cada uma
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      tags:
      - duvidas
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MinhaDuvida'
          description: ''
  /api/disciplinas/{disciplina_id}/tutor:
    get:
      operationId: disciplinas_tutor_retrieve
      summary: 'O tutor da disciplina para o aluno: regras, pausa, uso do dia e conversa'
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      tags:
      - tutor
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoDoTutor'
          description: ''
  /api/disciplinas/{disciplina_id}/tutor/configuracao:
    get:
      operationId: disciplinas_tutor_configuracao_retrieve
      description: O que o professor controla no tutor da disciplina (TUT-RF-06, TUT-RF-08
        e TUT-RF-10).
      summary: Configuração do tutor da disciplina
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      tags:
      - tutor
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuracao'
          description: ''
    patch:
      operationId: disciplinas_tutor_configuracao_partial_update
      description: Só os campos enviados mudam. O limite aceita 20, 40 ou 60 perguntas
        por dia.
      summary: Muda o modo pistas, o limite diário ou a política de uso de IA
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      tags:
      - tutor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedConfiguracaoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedConfiguracaoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedConfiguracaoRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuracao'
          description: ''
  /api/disciplinas/{disciplina_id}/tutor/perguntas:
    post:
      operationId: disciplinas_tutor_perguntas_create
      description: 'Resposta em eventos SSE: inicio {conversa_id}, texto {texto} (aos
        poucos), citacao {ordem, rotulo, trecho_id, material_id, pagina}, fim {tipo,
        mensagem_id} ou erro {mensagem}. O tipo do fim é resposta, pistas ou nao_encontrado.'
      summary: Pergunta ao tutor da disciplina, com a resposta em streaming
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      - in: query
        name: format
        schema:
          type: string
          enum:
          - eventos
          - json
      tags:
      - tutor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerguntaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PerguntaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PerguntaRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: ''
        '423':
          description: O tutor está pausado durante a prova.
        '429':
          description: O aluno chegou ao limite de perguntas de hoje.
        '503':
          description: O provedor de IA está indisponível.
  /api/entrada:
    get:
      operationId: entrada_retrieve
      description: |-
        Diz se há o login com o Google e o atalho de desenvolvimento. Entrega também o cookie
        CSRF que o formulário "Entrar com o Google" envia (ACE-RF-01).
      summary: Formas de entrar disponíveis neste ambiente
      tags:
      - contas
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormasDeEntrar'
          description: ''
  /api/eu:
    get:
      operationId: eu_retrieve
      summary: A pessoa que está logada
      tags:
      - contas
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eu'
          description: ''
  /api/eu/ciencia-privacidade:
    post:
      operationId: eu_ciencia_privacidade_create
      summary: Registra que a pessoa leu a versão atual do aviso de privacidade
      tags:
      - contas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CienciaDoAvisoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CienciaDoAvisoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CienciaDoAvisoRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/eu/historico:
    get:
      operationId: eu_historico_list
      description: 'O histórico do aluno com o tutor: ver e apagar (ACE-RF-09).'
      summary: As conversas do aluno com o tutor, por disciplina
      tags:
      - tutor
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversaDoHistorico'
          description: ''
    delete:
      operationId: eu_historico_destroy
      description: 'O histórico do aluno com o tutor: ver e apagar (ACE-RF-09).'
      summary: Apaga todo o histórico do aluno com o tutor
      tags:
      - tutor
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/eu/perfil-ativo:
    post:
      operationId: eu_perfil_ativo_create
      summary: Troca o perfil em uso, sem sair
      tags:
      - contas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrocaDePerfilRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TrocaDePerfilRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrocaDePerfilRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eu'
          description: ''
  /api/importacoes:
    post:
      operationId: importacoes_create
      description: Guarda o arquivo e põe o processamento na fila. O relatório sai
        em GET /importacoes/{id}.
      summary: Envia um CSV de turmas e matrículas (só administrador)
      tags:
      - importacoes
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnvioDeImportacaoRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportacaoCriada'
          description: ''
  /api/importacoes/{importacao_id}:
    get:
      operationId: importacoes_retrieve
      summary: Relatório de uma importação (só administrador)
      parameters:
      - in: path
        name: importacao_id
        schema:
          type: integer
        required: true
      tags:
      - importacoes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Importacao'
          description: ''
  /api/materiais/{material_id}:
    delete:
      operationId: materiais_destroy
      summary: Retira um material
      parameters:
      - in: path
        name: material_id
        schema:
          type: integer
        required: true
      tags:
      - materiais
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/materiais/{material_id}/arquivo:
    get:
      operationId: materiais_arquivo_retrieve
      description: Serve o arquivo só para quem tem acesso à disciplina. O aluno só
        abre material pronto. O parâmetro pagina é validado; o visualizador abre nessa
        página (MAT-RF-09).
      summary: Abre o PDF de um material
      parameters:
      - in: path
        name: material_id
        schema:
          type: integer
        required: true
      - in: query
        name: pagina
        schema:
          type: integer
          minimum: 1
        description: Página em que o visualizador deve abrir.
      tags:
      - materiais
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /api/materiais/{material_id}/versoes:
    post:
      operationId: materiais_versoes_create
      description: A versão anterior continua em uso até a nova ficar pronta (MAT-RF-11).
      summary: Envia a versão nova de um material
      parameters:
      - in: path
        name: material_id
        schema:
          type: integer
        required: true
      tags:
      - materiais
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NovaVersaoRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialEnviado'
          description: ''
  /api/mensagens/{mensagem_id}/avaliacao:
    put:
      operationId: mensagens_avaliacao_update
      description: Vazio desfaz a marcação. A resposta incorreta entra na fila de
        revisão da equipe. Mensagem que não é do aluno recebe 404.
      summary: Avalia uma resposta do tutor como útil, não útil ou incorreta
      parameters:
      - in: path
        name: mensagem_id
        schema:
          type: integer
        required: true
      tags:
      - tutor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvaliacaoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AvaliacaoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvaliacaoRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/mensagens/{mensagem_id}/duvida:
    post:
      operationId: mensagens_duvida_create
      summary: Envia a dúvida ao professor, sem o nome do aluno
      parameters:
      - in: path
        name: mensagem_id
        schema:
          type: integer
        required: true
      tags:
      - duvidas
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuvidaEnviada'
          description: ''
        '400':
          description: A mensagem não é uma resposta "não encontrei".
        '409':
          description: A dúvida já foi enviada.
        '429':
          description: O aluno já enviou 5 dúvidas hoje nesta disciplina.
  /api/mensagens/{mensagem_id}/duvida/previa:
    post:
      operationId: mensagens_duvida_previa_create
      summary: Mostra o texto que vai ao professor, já sem dados pessoais
      parameters:
      - in: path
        name: mensagem_id
        schema:
          type: integer
        required: true
      tags:
      - duvidas
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Previa'
          description: ''
        '400':
          description: A mensagem não é uma resposta "não encontrei".
        '409':
          description: A dúvida já foi enviada.
  /api/notificacoes:
    get:
      operationId: notificacoes_retrieve
      summary: As notificações da pessoa, das mais novas, e quantas não foram lidas
      tags:
      - notificacoes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacoes'
          description: ''
  /api/notificacoes/{notificacao_id}/lida:
    post:
      operationId: notificacoes_lida_create
      summary: Marca a notificação como lida
      parameters:
      - in: path
        name: notificacao_id
        schema:
          type: integer
        required: true
      tags:
      - notificacoes
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/sair:
    post:
      operationId: sair_create
      summary: Encerra a sessão
      tags:
      - contas
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/saude:
    get:
      operationId: saude_retrieve
      description: Diz que a API está no ar. Usada pelo Docker Compose e pelo monitoramento;
        não exige login.
      summary: Saúde da API
      tags:
      - nucleo
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Saude'
          description: ''
  /api/trechos/{trecho_id}:
    get:
      operationId: trechos_retrieve
      summary: A página citada com a posição do trecho, para destacar
      parameters:
      - in: path
        name: trecho_id
        schema:
          type: integer
        required: true
      tags:
      - materiais
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrechoParaAbrir'
          description: ''
components:
  schemas:
    AutorEnum:
      enum:
      - aluno
      - tutor
      type: string
      description: |-
        * `aluno` - Aluno
        * `tutor` - Tutor
    AvaliacaoEnum:
      enum:
      - util
      - nao_util
      - incorreta
      type: string
      description: |-
        * `` - Sem avaliação
        * `util` - Útil
        * `nao_util` - Não útil
        * `incorreta` - Incorreta
    AvaliacaoRequest:
      type: object
      description: util, nao_util ou incorreta; vazio desfaz a marcação.
      properties:
        avaliacao:
          oneOf:
          - $ref: '#/components/schemas/AvaliacaoEnum'
