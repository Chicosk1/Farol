openapi: 3.0.3
info:
  title: API do Farol
  version: 0.1.0
  description: API REST do Farol, tutor de estudos com IA da UNIMATER.
paths:
  /api/aviso-privacidade:
    get:
      operationId: aviso_privacidade_retrieve
      summary: Texto da versão atual do aviso de privacidade
      tags:
      - contas
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvisoDePrivacidade'
          description: ''
  /api/dev/entrar:
    post:
      operationId: dev_entrar_create
      description: |-
        Abre a sessão de uma pessoa fictícia pelo e-mail. A rota só existe com
        FAROL_LOGIN_DESENVOLVIMENTO ligado (ACE-RNF-03).
      summary: Entra pelo e-mail, sem login institucional (só desenvolvimento e teste)
      tags:
      - desenvolvimento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntradaDeDesenvolvimentoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EntradaDeDesenvolvimentoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EntradaDeDesenvolvimentoRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eu'
          description: ''
  /api/disciplinas:
    get:
      operationId: disciplinas_list
      summary: Disciplinas da pessoa no perfil em uso
      parameters:
      - in: query
        name: busca
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: query
        name: filtro
        schema:
          enum:
          - todas
          - favoritas
          - com-tutor
          type: string
          default: todas
          minLength: 1
        description: |-
          * `todas` - todas
          * `favoritas` - favoritas
          * `com-tutor` - com-tutor
      tags:
      - disciplinas
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Disciplina'
          description: ''
  /api/disciplinas/{disciplina_id}/favorito:
    put:
      operationId: disciplinas_favorito_update
      summary: Marca a disciplina como favorita
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      tags:
      - disciplinas
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
    delete:
      operationId: disciplinas_favorito_destroy
      summary: Marca a disciplina como favorita
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      tags:
      - disciplinas
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/disciplinas/{disciplina_id}/materiais:
    post:
      operationId: disciplinas_materiais_create
      description: Guarda o PDF, cria o material e põe o processamento na fila (MAT-RF-01
        a 03).
      summary: Envia o PDF de uma aula da disciplina
      parameters:
      - in: path
        name: disciplina_id
        schema:
          type: integer
        required: true
      tags:
      - materiais
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnvioDeMaterialRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialEnviado'
          description: ''
  /api/eu:
    get:
      operationId: eu_retrieve
      summary: A pessoa que está logada
      tags:
      - contas
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eu'
          description: ''
  /api/eu/ciencia-privacidade:
    post:
      operationId: eu_ciencia_privacidade_create
      summary: Registra que a pessoa leu a versão atual do aviso de privacidade
      tags:
      - contas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CienciaDoAvisoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CienciaDoAvisoRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CienciaDoAvisoRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/eu/perfil-ativo:
    post:
      operationId: eu_perfil_ativo_create
      summary: Troca o perfil em uso, sem sair
      tags:
      - contas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrocaDePerfilRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TrocaDePerfilRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrocaDePerfilRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eu'
          description: ''
  /api/importacoes:
    post:
      operationId: importacoes_create
      description: Guarda o arquivo e põe o processamento na fila. O relatório sai
        em GET /importacoes/{id}.
      summary: Envia um CSV de turmas e matrículas (só administrador)
      tags:
      - importacoes
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnvioDeImportacaoRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportacaoCriada'
          description: ''
  /api/importacoes/{importacao_id}:
    get:
      operationId: importacoes_retrieve
      summary: Relatório de uma importação (só administrador)
      parameters:
      - in: path
        name: importacao_id
        schema:
          type: integer
        required: true
      tags:
      - importacoes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Importacao'
          description: ''
  /api/sair:
    post:
      operationId: sair_create
      summary: Encerra a sessão
      tags:
      - contas
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/saude:
    get:
      operationId: saude_retrieve
      description: Diz que a API está no ar. Usada pelo Docker Compose e pelo monitoramento;
        não exige login.
      summary: Saúde da API
      tags:
      - nucleo
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Saude'
          description: ''
components:
  schemas:
    AvisoDePrivacidade:
      type: object
      properties:
        versao:
          type: string
        titulo:
          type: string
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemDoAviso'
      required:
      - itens
      - titulo
      - versao
    CienciaDoAvisoRequest:
      type: object
      properties:
        versao:
          type: string
          minLength: 1
          description: A versão do aviso que a pessoa leu.
      required:
      - versao
    Disciplina:
      type: object
      properties:
        id:
          type: integer
        codigo:
          type: string
        nome:
          type: string
        turma:
          type: string
        semestre:
          type: string
        professor_nome:
          type: string
        favorita:
          type: boolean
          description: Se a pessoa marcou a disciplina como favorita.
      required:
      - codigo
      - favorita
      - id
      - nome
      - professor_nome
      - semestre
      - turma
    EntradaDeDesenvolvimentoRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    EnvioDeImportacaoRequest:
      type: object
      properties:
        arquivo:
          type: string
          format: binary
          description: CSV em UTF-8, separado por vírgula, de até 5 MB.
      required:
      - arquivo
    EnvioDeMaterialRequest:
      type: object
      properties:
        arquivo:
          type: string
          format: binary
          description: O PDF da aula.
        aula_numero:
          type: integer
          maximum: 999
          minimum: 1
        aula_titulo:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - arquivo
      - aula_numero
      - aula_titulo
    Eu:
      type: object
      description: A pessoa que está usando o Farol, com os perfis dela e o perfil
        em uso.
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        nome:
          type: string
        perfis:
          type: array
          items:
            $ref: '#/components/schemas/PerfilEnum'
        perfil_ativo:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PerfilEnum'
          - $ref: '#/components/schemas/NullEnum'
        precisa_ver_aviso:
          type: boolean
          description: Se o aluno ainda precisa ler a versão atual do aviso de privacidade.
      required:
      - email
      - id
      - nome
      - perfil_ativo
      - perfis
      - precisa_ver_aviso
    Importacao:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusDaImportacaoEnum'
          readOnly: true
        aceitas:
          type: integer
          readOnly: true
          title: Linhas aceitas
        rejeitadas:
          type: array
          items:
            $ref: '#/components/schemas/LinhaRejeitada'
        matriculas_encerradas:
          type: integer
          readOnly: true
          title: Matrículas encerradas
        erro:
          type: string
          readOnly: true
          title: Motivo da recusa
          description: Problema que impediu de importar o arquivo.
        aviso:
          type: string
          readOnly: true
        enviada_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - aceitas
      - aviso
      - enviada_em
      - erro
      - id
      - matriculas_encerradas
      - rejeitadas
      - status
    ImportacaoCriada:
      type: object
      properties:
        id:
          type: integer
        status:
          $ref: '#/components/schemas/StatusDaImportacaoEnum'
      required:
      - id
      - status
    ItemDoAviso:
      type: object
      properties:
        titulo:
          type: string
        texto:
          type: string
      required:
      - texto
      - titulo
    LinhaRejeitada:
      type: object
      properties:
        linha:
          type: integer
          description: Número da linha no arquivo; o cabeçalho é a linha 1.
        motivo:
          type: string
      required:
      - linha
      - motivo
    MaterialEnviado:
      type: object
      properties:
        material_id:
          type: integer
        status:
          $ref: '#/components/schemas/StatusDoMaterialEnum'
      required:
      - material_id
      - status
    NullEnum:
      enum:
      - null
    PerfilEnum:
      enum:
      - aluno
      - professor
      - coordenacao
      - admin
      type: string
      description: |-
        * `aluno` - Aluno
        * `professor` - Professor
        * `coordenacao` - Coordenação
        * `admin` - Administrador
    Saude:
      type: object
      properties:
        status:
          type: string
          description: Sempre "ok" quando a API está no ar.
      required:
      - status
    StatusDaImportacaoEnum:
      enum:
      - pendente
      - processando
      - concluida
      - recusada
      type: string
      description: |-
        * `pendente` - Pendente
        * `processando` - Processando
        * `concluida` - Concluída
        * `recusada` - Recusada
    StatusDoMaterialEnum:
      enum:
      - processando
      - pronto
      - atencao
      - erro
      - retirado
      type: string
      description: |-
        * `processando` - Processando
        * `pronto` - Pronto para o tutor
        * `atencao` - Precisa de atenção
        * `erro` - Erro, tente de novo
        * `retirado` - Retirado
    TrocaDePerfilRequest:
      type: object
      properties:
        perfil:
          $ref: '#/components/schemas/PerfilEnum'
      required:
      - perfil
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
